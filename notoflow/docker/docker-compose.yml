services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: notoflow
      POSTGRES_PASSWORD: notoflow
      POSTGRES_DB: notoflow
    ports:
      - "5432:5432"
    volumes:
      - notoflow_pg:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U notoflow -d notoflow"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - notoflow_redis:/data

  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://notoflow:notoflow@db:5432/notoflow?schema=public
      NODE_ENV: production
    depends_on:
      db:
        condition: service_healthy

volumes:
  notoflow_pg:
  notoflow_redis:
